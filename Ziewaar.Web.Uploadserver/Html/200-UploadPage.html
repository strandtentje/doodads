<div class="uploadbox">
    <iframe id="uploadSink" src="about:blank">

    </iframe>

    <img src="{% url %}?uploadBoxId={% uploadBoxId %}&amp;functionId=PROGRESS" />

    <form method="post" enctype="multipart/form-data" target="uploadSink"
          action="{% url %}?uploadBoxId={% uploadBoxId %}&amp;functionId=UPLOAD">
        <label for="files">Select files to Upload</label>
        <input type="file" id="files" name="files" {% multiple %} accept="{% accept %}"/>
        <!-- accept=".pdf,audio/*,video/*,image/*" -->
        <input type="submit" value="Send" />
    </form>
</div>
